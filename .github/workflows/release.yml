# Release binaries for Linux, macOS and Windows, attached to the GitHub release of a tag v*.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Keep line breaks
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - name: Install the toolchain of rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="easy-peasy-mcp-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/easy-peasy-mcp" README.md INSTALL.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"
      - name: Package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "easy-peasy-mcp-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/easy-peasy-mcp.exe", README.md, INSTALL.md, LICENSE $name
          Compress-Archive $name "$name.zip"
          "ARCHIVE=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: easy-peasy-mcp-*
          generate_release_notes: true
