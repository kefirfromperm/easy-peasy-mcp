[package]
name = "easy-peasy-mcp"
version = "0.145.0"
edition = "2024"
rust-version = "1.98"
description = "Local stdio MCP server: find files and places in files with one query"
license-file = "LICENSE"
publish = false

[lib]
name = "easy_peasy_mcp"
path = "src/lib.rs"

[[bin]]
name = "easy-peasy-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
toml_edit = "0.25.15"
encoding_rs = "0.8.42"
ignore = "0.4.33"
jiff = "0.2.38"
regex = "1.13.1"
rmcp = { version = "3.5.1", features = ["server", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "io-std", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1.25"
flate2 = "1.1.10"
bzip2 = "0.6.1"
ruzstd = "0.9.0"
lzma-rust2 = { version = "0.21.0", default-features = false, features = ["std", "xz"] }
lz4_flex = { version = "0.14.0", default-features = false, features = ["std", "safe-decode", "frame"] }
zip = { version = "9.0.1", default-features = false, features = ["deflate-flate2-zlib-rs", "bzip2", "deflate64", "lzma", "xz"] }
tar = "0.4.46"
sevenz-rust2 = { version = "0.23.0", default-features = false, features = ["bzip2", "ppmd"] }
trash = "5.2.9"
# the modification times of copied directories and symlinks
filetime = "0.2.29"

# the volume serial number and the file index which identify a file on Windows
[target.'cfg(windows)'.dependencies]
winapi-util = "0.1.11"

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
